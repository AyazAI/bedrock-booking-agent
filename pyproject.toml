[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-booking-agent"
version = "0.1.0"
description = "Sample booking assistant with tool calling, local RAG, and a pluggable LLM."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Ayaz" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6",
  "chromadb>=0.5.23",
  "openai>=1.55",
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["booking_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["booking_agent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
packages = ["booking_agent"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*", "boto3", "botocore", "botocore.*", "pgvector", "pgvector.*", "yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
