services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: mock
      VECTOR_BACKEND: chroma
      DATABASE_URL: sqlite:////data/bookings.db
      CHROMA_PATH: /data/chroma
      PORT: "8000"
    volumes:
      - booking-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  booking-data:
